<div class="form_page">
  <div class="form_card myForm">
    <h2 class="form_title">Create Account</h2>
    <p class="form_subtitle">Fill in the details below to register</p>

    <form>

      <div class="row_div">
        <label>Full Name <sup>*</sup></label>
        <input type="text" placeholder="Enter your full name" />
      </div>

      <div class="row_div">
        <label>Email Address <sup>*</sup></label>
        <input type="email" placeholder="Enter your email" />
      </div>

      <div class="row_div">
        <label>Username</label>
        <input type="text" placeholder="Choose a username (optional)" />
      </div>

      <div class="row_div">
        <label>Password <sup>*</sup></label>
        <input type="password" placeholder="Enter your password" />
      </div>

      <div class="row_div">
        <label>Confirm Password <sup>*</sup></label>
        <input type="password" placeholder="Re-enter your password" />
      </div>

      <div class="row_div">
        <label>Phone Number</label>
        <input type="tel" placeholder="Enter phone number (optional)" />
      </div>

      <div class="row_div">
        <label>Date of Birth</label>
        <input type="date" />
      </div>

      <div class="row_div terms_row">
        <label class="terms_label">
          <input type="checkbox" />
          <span>I accept the <a href="#" class="terms_link">Terms &amp; Conditions</a></span>
        </label>
      </div>

      <div class="row_div">
        <button type="submit" class="fill_btn">Register</button>
      </div>

    </form>
  </div>
</div>
