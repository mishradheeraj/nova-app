<div class="form_page">
  <div class="form_card myForm">
    <h2 class="form_title">Create Account</h2>
    <p class="form_subtitle">Fill in the details below to register</p>

    <form [formGroup]="myform">
      <div class="row_div">
        <label>Full Name <sup>*</sup></label>
        <cats-ui-input [inputConfig]="inputConfig" required formControlName="fname">
        </cats-ui-input>
      </div>

      <div class="row_div">
        <label>Email Address <sup>*</sup></label>
        <cats-ui-input [inputConfig]="inputConfig" required formControlName="email">
        </cats-ui-input>
      </div>

      <div class="row_div">
        <label>Username</label>
        <cats-ui-input [inputConfig]="inputConfig" required formControlName="username" />
      </div>

      <div class="row_div">
        <label>Password <sup>*</sup></label>
        <cats-ui-input [inputConfig]="inputConfig" required formControlName="pass" />
      </div>

      <div class="row_div">
        <label>Confirm Password <sup>*</sup></label>
        <cats-ui-input [inputConfig]="inputConfig" required formControlName="cpass" />
      </div>

      <div class="row_div">
        <label>Phone Number</label>
        <cats-ui-input [inputConfig]="inputConfig" required formControlName="number" />
      </div>

      <div class="row_div">
        <label>Date of Birth</label>
        <cats-ui-custom-date-picker
          [config]="{ mode: 'single', time: true, parentDateFormat: 'MM/dd/yyyy' }"
          (applied)="displayData($event)"
          formControlName="date"
        >
        </cats-ui-custom-date-picker>
      </div>

      <div class="row_div terms_row">
        <label class="terms_label">
          <input type="checkbox" />
          <span>I accept the <a href="#" class="terms_link">Terms &amp; Conditions</a></span>
        </label>
      </div>

      <div class="row_div">
        <button type="button" class="fill_btn" (click)="onsubmit()">Register</button>
      </div>
    </form>
  </div>
</div>
